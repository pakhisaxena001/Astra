<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2 class="sidebar-title">Astra</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="features.html">Features</a></li>
            <li><a href="contacts.html">Contacts</a></li>
           <li><a href="register.html">Register</a></li>
        </ul>
    </div>


    <div class="location-container">
        <h2>Your Live Location</h2>
        <button onclick="getLocation()" class="location-btn">Show My Location</button>
        <p id="location-status"></p>
        <iframe id="map" width="100%" height="400" style="display:none;"></iframe>
    </div>

    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                document.getElementById("location-status").innerText = "Geolocation is not supported by this browser.";
            }
        }

        function showPosition(position) {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;
            let mapFrame = document.getElementById("map");
            mapFrame.style.display = "block";
            mapFrame.src = `https://www.google.com/maps?q=${lat},${lon}&output=embed`;
        }

        function showError(error) {
            let errorMessage = "Unable to retrieve location.";
            if (error.code === error.PERMISSION_DENIED) errorMessage = "User denied location access.";
            document.getElementById("location-status").innerText = errorMessage;
        }
    </script>

</body>
</html>
