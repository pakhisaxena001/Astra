<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra - Emergency Alerts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2 class="sidebar-title">Astra</h2>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="features.html">Features</a></li>
            <li><a href="contacts.html">Contacts</a></li>
           <li><a href="register.html">Register</a></li>
        </ul>
    </div>

    
    <div class="emergency-container">
        <h2>Emergency Alerts</h2>
        <p>Send an emergency alert to your trusted contacts with your live location.</p>

        <button class="emergency-btn" onclick="sendEmergencyAlert()">⚠️ Send Emergency Alert</button>
        <p id="alert-status"></p>
    </div>

    <script>
        function sendEmergencyAlert() {
            document.getElementById("alert-status").innerText = "🚨 Emergency alert sent to your trusted contacts!";
            setTimeout(() => {
                document.getElementById("alert-status").innerText = "";
            }, 5000);
        }
    </script>

</body>
</html>
