    <div class="safe-zone-container">
        <h2>Safe Zones</h2>
        <p>Mark and view safe zones to ensure security in specific locations.</p>

        <form class="safe-zone-form">
            <label for="zone-name">Safe Zone Name</label>
            <input type="text" id="zone-name" name="zone-name" placeholder="Enter Safe Zone Name" required>

            <label for="zone-location">Location</label>
            <input type="text" id="zone-location" name="zone-location" placeholder="Enter Location or Coordinates" required>

            <button type="submit" class="safe-zone-btn">Add Safe Zone</button>
        </form>

        <h3>Existing Safe Zones</h3>
        <ul class="safe-zone-list">
            <li>🏠 Home</li>
            <li>🏢 Workplace</li>
            <li>🏫 School</li>
        </ul>
    </div>
