    <div class="form-container">
        <h2>Add Emergency Contact</h2>
        <form action="#" method="POST">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="contact-name" placeholder="Enter Name" required>

            <label for="contact-number">Phone Number</label>
            <input type="tel" id="contact-number" name="contact-number" placeholder="Enter Phone Number" required>

            <button type="submit" class="form-btn">Save Contact</button>
        </form>
    </div>

</body>
